<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        .box{
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;

        }
        .box1{
            background-color: beige;
            position: sticky;
            top: 0px;
             height: 163px;
            width: 90vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
            /* position: absolute; */
        

        }
        .box2{
            background-color: blueviolet;
            position: relative;
            /* top: 66px; */
            /* left: 65px; */
            position: fixed;

        }
        .box3{
            background-color:bisque;
            /* position: fixed;
            bottom: 50px; */
            /* left: 3v5; */
        
        }
        .box4{
            background-color:rgb(171, 122, 61);
            
            

        }


        *{
            margin: 5px;
            padding: 0;
        }
        
        .parent {
            background-color: rgb(124, 124, 231);
            padding: 43px;
            margin: 34px;
            border: 5px solid black;
            /* exceptional properties */
            /* position: absolute; */
            /* filter: invert(); */
            /* transform: translate("0"); */
            /* perspective: 0em; */
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>

    </div>
    
</body>
</html>
