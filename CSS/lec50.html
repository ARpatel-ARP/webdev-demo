<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS filter</title>
    <style>
        img{
            filter: contrast(100%);
           filter: blur(5px) grayscale(90%);
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="https://media.zenfs.com/en/variety.com/d0b9c426f1530fbeaf447f6b6db6106f" alt="">
    </div>
</body>
</html>
