<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            border: 2px solid black;
            width: 1000px;
            height: 80vh;
            display: flex;
            justify-content: top;
            margin-left: 100px;
            align-items: top;
            background-color: grey;
            flex-direction: row;
            /* flex-wrap: wrap; */
            align-content: top;
            /* row-gap: 10px;
            column-gap: 20px; */
            /* gap: 10px 20px ; short form ./ */
        }
        .item{

            width: 35px;
            border: 2px solid red;
            /* margin: 2px; */
            /* flex-grow: 1; */
            

        }
        .item1{
            /* flex-grow: 5; */
        }
        .order1{
            order: 1;
            /* flex-grow: 5; */
        }
        
        .order2{
            order: 2;
        }
        
        .order3{
            order: 3;
            /* flex-grow: 5; */
        }
        .item2{
            /* flex-grow: 7; */
            flex-shrink: 2;
        }

    </style>

    <div class="container">

    </div>
    
</body>
</html>
