<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS display property </title>
    <style>
        *{
            margin: 0;
        }
        .box {
            border: 2px solid black;
            display: inline-block;
            padding: 45px;
            margin: 2vw;
            /* width: 45px; no effect */
            display: inline-flex;
            justify-content: center;
        }
    </style>

</head>
<body>
    <div class="box">
        i am box 
    </div>
    <div class="box">hjjxc</div>
    <span class="box">ia am span</span>
    
</body>
</html>
