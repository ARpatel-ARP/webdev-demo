<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animations</title>
    <style>
        .container{
            background-color: antiquewhite;
            width:40vw;
            height: 80vh;
        }
        .box{
            background-color: beige;
            border: 2px solid black;
             width:4vw;
            height: 8vh;
            /* animation-name:rautjianimation ;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(1, 0.18, 0.04, 1.01) ; */
            /* animation-direction: alternate-reverse; */
            /* animation-play-state: paused; */
            /* animai */
            animation: rautjianimation 5s  cubic-bezier(1, 0.18, 0.04, 1.01) 1s 2 backwards ,rautjianimation2 5s ease-in 5 normal ;
            
        }

        @keyframes rautjianimation {
            from{
                background-color: grey;

            }
            to{
                transform: translateX(1000px);
                background-color: black;
            }
        }
         @keyframes rautjianimation2{
            0%{
                transform: rotate(100deg);
            }
            25%{
                transform: rotate(60deg);
            }
            50%{
                transform: rotate(40deg);
            }
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Rautji
        </div>
    </div>
    
</body>
</html>
